# Construit l'installateur Windows (.exe) et l'image Mac (.dmg),
# puis les publie sur la page « Releases » quand on pousse un tag de version (ex. v2.2.0).
name: Installateurs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            fichiers: desktop/dist/CrateSort-Windows.exe
          - os: macos-latest
            script: build:mac
            fichiers: desktop/dist/CrateSort-Mac.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Installer les dépendances
        working-directory: desktop
        run: npm ci
      - name: Construire
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-${{ matrix.os }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error

  publier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - name: Créer la version sur la page Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installateurs/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CrateSort ${GITHUB_REF_NAME#v}" \
            --notes-file .github/notes-de-version.md
