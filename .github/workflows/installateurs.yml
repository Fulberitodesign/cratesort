# Construit l'installateur Windows (.exe) et l'image Mac (.dmg),
# puis les ajoute à la version publiée sur la page « Releases ».
# Déclencheurs : publication d'une Release sur GitHub (un clic), ou tag de version poussé (ex. v2.2.0).
name: Installateurs

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

# Une seule publication à la fois par version (une Release crée aussi son tag)
concurrency:
  group: installateurs-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  construire:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            # latest.yml : sert aux mises à jour automatiques de l'app Windows
            fichiers: |
              desktop/dist/CrateSort-Windows.exe
              desktop/dist/latest.yml
          - os: macos-latest
            script: build:mac
            fichiers: desktop/dist/CrateSort-Mac.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Installer les dépendances
        working-directory: desktop
        run: npm ci
      - name: Construire
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: installateur-${{ matrix.os }}
          path: ${{ matrix.fichiers }}
          if-no-files-found: error

  publier:
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    needs: construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installateurs
          merge-multiple: true
      - name: Ajouter les installateurs à la version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" installateurs/* --clobber --repo "$GITHUB_REPOSITORY"
            # Description vide : on met les instructions d'installation
            if [ -z "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file .github/notes-de-version.md
            fi
          else
            gh release create "$TAG" installateurs/* --repo "$GITHUB_REPOSITORY" \
              --title "CrateSort ${TAG#v}" --notes-file .github/notes-de-version.md
          fi
